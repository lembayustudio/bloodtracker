<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHealth PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body class="bg-slate-50 pb-10">
    <nav class="bg-white border-b p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">MyHealth</h1>
            <button id="authBtn" onclick="handleAuthClick()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">
                Login Google
            </button>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <div id="status" class="hidden p-3 bg-green-100 text-green-700 rounded-lg text-xs text-center">
            Terhubung dengan Google Drive anda.
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border space-y-4">
            <h3 class="font-bold border-b pb-2">🩸 Ujian Darah Asas (FBC)</h3>
            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="hb" placeholder="Hb (g/dL)" class="border-b p-2 focus:outline-none">
                <input type="number" id="wbc" placeholder="WBC (10^9/L)" class="border-b p-2 focus:outline-none">
                <input type="number" id="platelet" placeholder="Platelet" class="border-b p-2 focus:outline-none">
                <select id="bloodGroup" class="border-b p-2 bg-transparent text-gray-500">
                    <option value="">Kump. Darah</option>
                    <option>A+</option><option>O+</option><option>B+</option><option>AB+</option>
                </select>
            </div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border space-y-4">
            <h3 class="font-bold border-b pb-2">🍬 Gula & Kolesterol</h3>
            <input type="number" id="fbs" placeholder="Fasting Glucose (mmol/L)" class="w-full border-b p-2">
            <input type="number" id="hba1c" placeholder="HbA1c (%)" class="w-full border-b p-2">
            <input type="number" id="chol" placeholder="Total Cholesterol (mmol/L)" class="w-full border-b p-2">
        </div>

        <button onclick="saveToGoogle()" id="saveBtn" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg">
            Simpan ke Google Sheet
        </button>

        <a href="URL_DONATION_ANDA" target="_blank" class="block w-full bg-yellow-400 text-center py-3 rounded-xl font-bold text-yellow-900 mt-10">
            ☕ Belanja Saya Kopi
        </a>
    </main>

    <script>
        const CLIENT_ID = '30864450637-qaejqmqnq79jq2t7i188ka1fi32oc9m2.apps.googleusercontent.com'; // <-- MASUKKAN SINI
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';
        
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        function gapiLoaded() { gapi.load('client', () => { gapi.client.init({}).then(() => { gapiInited = true; }); }); }
        window.onload = () => { gapiLoaded(); gisLoaded(); };

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse.error) return;
                    document.getElementById('authBtn').innerText = "Logged In";
                    document.getElementById('status').classList.remove('hidden');
                },
            });
            gisInited = true;
        }

        function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }

        async function saveToGoogle() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Sedang Menyimpan...";
            // Logik penghantaran data akan diproses di sini
            alert("Data akan dihantar ke peribadi Google Sheet anda!");
            btn.innerText = "Simpan ke Google Sheet";
        }
    </script>
</body>
</html>
